<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b66">
  <meta name="description" content="SSIC1060 Student Information Portal for teachers and administrators.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>SSIC1060 Portal</title>
  <style>
    :root { color-scheme: light; --navy:#123b66; --blue:#1769aa; --bg:#f2f6fb; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; font-family:Arial,Helvetica,sans-serif; background:var(--bg); }
    .app { display:flex; flex-direction:column; height:100dvh; min-height:100%; }
    header { background:var(--navy); color:white; padding:12px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 8px #0002; z-index:2; }
    .mark { width:42px; height:42px; flex:0 0 42px; border-radius:10px; background:white; color:var(--navy); display:grid; place-items:center; font-weight:800; font-size:13px; }
    .heading { min-width:0; }
    .heading strong { display:block; font-size:17px; line-height:1.25; }
    .heading span { display:block; opacity:.88; font-size:12px; margin-top:3px; }
    .actions { margin-left:auto; display:flex; gap:8px; }
    button { border:0; border-radius:8px; padding:9px 11px; font-weight:700; cursor:pointer; }
    #installBtn { background:#fff; color:var(--navy); display:none; }
    #reloadBtn { background:#ffffff20; color:white; border:1px solid #ffffff70; }
    main { flex:1; min-height:0; position:relative; }
    iframe { width:100%; height:100%; border:0; display:block; background:white; }
    .notice { padding:7px 12px; text-align:center; font-size:11px; color:#46566a; background:#e5edf6; }
    @media(max-width:480px) {
      header { padding:10px; gap:9px; }
      .mark { width:38px; height:38px; flex-basis:38px; }
      .heading strong { font-size:14px; }
      .heading span { font-size:11px; }
      button { padding:8px; font-size:12px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">SSIC<br>1060</div>
    <div class="heading">
      <strong>SSIC1060 Portal</strong>
      <span>Teacher &amp; Admin access</span>
    </div>
    <div class="actions">
      <button id="installBtn" type="button">Install</button>
      <button id="reloadBtn" type="button" aria-label="Reload portal">↻</button>
    </div>
  </header>
  <main>
    <iframe id="portalFrame" title="SSIC1060 Student Information Portal"
      src="https://script.google.com/macros/s/AKfycby8wSFFp5XAvPg-HLosCQLEL7riKhAAtkCPZE9-zzE-A7b77mf6VkHJtEOOrQ9fAu6yuw/exec" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  </main>
  <div class="notice">Internet connection is required to use the portal. Your existing portal and data remain on Google Apps Script.</div>
</div>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(console.warn));
  }
  const frame = document.getElementById('portalFrame');
  document.getElementById('reloadBtn').addEventListener('click', () => {
    frame.src = frame.src;
  });
  let installPrompt;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    installPrompt = event;
    installBtn.style.display = 'inline-block';
  });
  installBtn.addEventListener('click', async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    installBtn.style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
  });
</script>
</body>
</html>
